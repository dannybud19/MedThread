<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Reminder times — Metformin</title>
<link rel="stylesheet" href="shared.css" />
</head>
<body>
<div class="screen">

  <div class="section" style="margin-bottom: var(--space-md)">
    <a class="backlink" href="medicines.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" width="20" height="20"><path d="M15 18l-6-6 6-6"/></svg>
      <span>Back to your medicines</span>
    </a>
  </div>

  <div class="section">
    <h1 class="h1">Metformin reminder times</h1>
    <p class="body">Twice a day — set a time for each dose. We'll only remind you once you've
      chosen a time; nothing is set automatically.</p>
  </div>

  <!-- "Large number over small label" pattern, per your brief — the one thing not shown in the
       reference image itself. Illustrative fixed value here; in the real app this is computed live
       from the nearer of the two confirmed times below. -->
  <div class="section">
    <div class="card" style="text-align: center">
      <div class="display" id="countdown">3h 20m</div>
      <div class="label">until your next dose</div>
    </div>
  </div>

  <!--
    NATIVE-PORT NOTE: this time-chip selector stands in for what becomes a native time picker
    (UIDatePicker / Android TimePicker) later. Built as one self-contained block per dose slot
    (markup + the one selectTime() function below) so swapping it for a native control is a clean
    cut — nothing elsewhere on the page depends on its internals.

    SCOPING NOTE: only Metformin (2 dose slots) is fully built out here, to demonstrate "every time
    option, individually selectable, per dose" — the richest example, since it needs two independent
    selectors. The other 3 medications (1 slot each) reuse the exact same component; not rebuilt
    3 more times for what would be identical demonstration.
  -->

  <div class="section">
    <h2 class="h2">Morning dose</h2>
    <div class="chiprow" role="group" aria-label="Morning dose time">
      <button type="button" class="chip" aria-pressed="false" onclick="selectTime(this)">7:00 AM</button>
      <button type="button" class="chip" aria-pressed="true" onclick="selectTime(this)">7:30 AM</button>
      <button type="button" class="chip" aria-pressed="false" onclick="selectTime(this)">8:00 AM</button>
      <button type="button" class="chip" aria-pressed="false" onclick="selectTime(this)">8:30 AM</button>
      <button type="button" class="chip" aria-pressed="false" onclick="selectTime(this)">9:00 AM</button>
    </div>
  </div>

  <div class="section">
    <h2 class="h2">Evening dose</h2>
    <div class="chiprow" role="group" aria-label="Evening dose time">
      <button type="button" class="chip" aria-pressed="false" onclick="selectTime(this)">5:00 PM</button>
      <button type="button" class="chip" aria-pressed="false" onclick="selectTime(this)">5:30 PM</button>
      <button type="button" class="chip" aria-pressed="true" onclick="selectTime(this)">6:00 PM</button>
      <button type="button" class="chip" aria-pressed="false" onclick="selectTime(this)">6:30 PM</button>
      <button type="button" class="chip" aria-pressed="false" onclick="selectTime(this)">7:00 PM</button>
    </div>
  </div>

</div>

<script src="tokens.js"></script>
<script src="shared.js"></script>
<script>
  renderTabBar("history"); // Reminder Times nests under History → Medicines, same as Medicines itself
  initChips();

  /** Selection is scoped to the chip's own row, so picking a morning time never affects evening. */
  function selectTime(btn) {
    var row = btn.closest(".chiprow");
    row.querySelectorAll(".chip").forEach(function (c) { c.setAttribute("aria-pressed", "false"); });
    btn.setAttribute("aria-pressed", "true");
  }
</script>
</body>
</html>
